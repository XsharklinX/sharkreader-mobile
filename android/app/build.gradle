apply plugin: 'com.android.application'

// Firma de release. Las credenciales viven en keystore.properties, que está en
// .gitignore — el keystore nunca entra al repositorio. Si el fichero no existe,
// el build de release sigue funcionando sin firmar (útil para verificar que
// compila sin tener las claves a mano).
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasSigningConfig = keystorePropertiesFile.exists()
if (hasSigningConfig) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.sharkreader.mobile"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.sharkreader.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 15
        versionName "1.2.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasSigningConfig) {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // R8 activado desde la Fase 0 a propósito: si algo se rompe al
            // ofuscar, es mejor descubrirlo ahora que la semana del lanzamiento.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasSigningConfig) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            // Sin applicationIdSuffix: cambiar el id del paquete en debug obliga
            // a que cada plugin derive bien su authority y es una fuente de
            // fallos de instalación difíciles de diagnosticar. Para una app que
            // no se instala junto a su propia versión de release, no aporta nada.
            versionNameSuffix "-debug"
        }
    }

    // Firma v2 y v3. La v1 (JAR) solo hace falta por debajo de API 24, así que
    // con minSdk 26 el propio AGP la omite aunque se pida; no se fuerza para no
    // dejar en el fichero una opción que no tiene efecto.
    signingConfigs.debug {
        enableV2Signing true
        enableV3Signing true
    }

    // Un APK por arquitectura además del universal. El universal pesa 25 MB
    // porque lleva las cuatro variantes de la librería nativa de SQLite; el de
    // arm64 ronda los 9 MB. Menos peso significa menos posibilidades de que una
    // copia al móvil se trunque, que es la causa más habitual de que un APK
    // válido falle al instalar.
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a'
            universalApk true
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // MediaSessionCompat y el estilo multimedia de notificación, para que la
    // lectura en voz alta se controle desde la pantalla de bloqueo y los
    // auriculares.
    implementation "androidx.media:media:1.7.0"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
