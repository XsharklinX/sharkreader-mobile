<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Gráfico destacado</title>
<link rel="stylesheet" href="/src/fonts/fonts.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=block">
<style>
/* Gráfico destacado de Google Play, 1024×500. Lo importante va lejos de los
   bordes: la tienda lo recorta en algunas vistas y pone encima el botón de
   vídeo si lo hay. */
html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; }
body {
    position: relative;
    background:
        radial-gradient(ellipse 620px 420px at 78% 40%, rgba(56, 189, 248, 0.22), transparent 70%),
        radial-gradient(ellipse 500px 360px at 0% 100%, rgba(2, 132, 199, 0.18), transparent 70%),
        #0B1222;
    color: #F1F5F9;
    font-family: Roboto, 'Segoe UI', sans-serif;
}
.texto { position: absolute; left: 72px; top: 0; bottom: 0; width: 470px; display: flex; flex-direction: column; justify-content: center; }
.marca { display: flex; align-items: center; gap: 18px; }
.marca img { width: 84px; height: 84px; border-radius: 22px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45); }
.marca span { font-family: Literata, Georgia, serif; font-size: 50px; letter-spacing: -0.01em; }
h1 { margin: 30px 0 0; font-family: Literata, Georgia, serif; font-weight: 400; font-size: 40px; line-height: 1.15; text-wrap: balance; }
p { margin: 16px 0 0; font-size: 21px; line-height: 1.4; color: #A5B4C8; text-wrap: balance; max-width: 420px; }
.telefono {
    position: absolute;
    width: 236px;
    padding: 8px;
    border-radius: 36px;
    background: linear-gradient(160deg, #2A3A52, #121B2C 45%, #1C2840);
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.06) inset, 0 30px 70px rgba(0, 0, 0, 0.55);
}
.telefono img { display: block; width: 100%; border-radius: 29px; }
.atras { left: 790px; top: 70px; transform: rotate(7deg); }
.delante { left: 600px; top: 44px; transform: rotate(-4deg); }
</style>
</head>
<body>
<div class="texto">
    <div class="marca"><img id="icono" alt=""><span>SharkReader</span></div>
    <h1 id="titulo"></h1>
    <p id="linea"></p>
</div>
<div class="telefono atras"><img id="atras" alt=""></div>
<div class="telefono delante"><img id="delante" alt=""></div>
<script>
window.montar = async ({ titulo, linea, icono, delante, atras }) => {
    document.getElementById('titulo').textContent = titulo;
    document.getElementById('linea').textContent = linea;
    const cargar = (id, src) => new Promise((ok) => { const img = document.getElementById(id); img.onload = ok; img.src = src; });
    await Promise.all([cargar('icono', icono), cargar('delante', delante), cargar('atras', atras)]);
    await document.fonts.ready;
    window.__montada = true;
};
</script>
</body>
</html>
